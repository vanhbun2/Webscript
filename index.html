<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Giải hệ phương trình</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    font-family:Arial;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
    padding:40px 15px
}
.box{
    max-width:700px;
    margin:auto;
    background:#ffffff12;
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 35px #0005
}
h1,h2{text-align:center}
.system{text-align:center;font-size:22px;line-height:1.8}
.row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:15px 0 25px
}
label{font-size:14px;color:#cbd5e1}
input{
    width:100%;
    margin-top:6px;
    padding:11px;
    border:1px solid #64748b;
    border-radius:9px;
    background:#0f172acc;
    color:white;
    text-align:center;
    font-size:16px
}
button{
    width:48%;
    padding:12px;
    border:0;
    border-radius:9px;
    color:white;
    font-weight:bold;
    cursor:pointer
}
.solve{background:#2563eb}
.clear{background:#475569}
.buttons{display:flex;justify-content:space-between}
#result{
    display:none;
    margin-top:20px;
    background:#0f172acc;
    padding:20px;
    border-radius:14px;
    line-height:2
}
.step{
    padding:12px 15px;
    margin:12px 0;
    border-left:4px solid #60a5fa;
    background:#ffffff08;
    border-radius:8px
}
.answer{
    text-align:center;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
    background:#16a34a33
}
@media(max-width:550px){
    .row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="box">

<h1>🧮 Giải hệ phương trình</h1>

<div class="system">
    ax + by = c<br>
    a'x + b'y = c'
</div>

<h3>Phương trình 1</h3>
<div class="row">
    <div>
        <label>a</label>
        <input id="a" type="number">
    </div>
    <div>
        <label>b</label>
        <input id="b" type="number">
    </div>
    <div>
        <label>c</label>
        <input id="c" type="number">
    </div>
</div>

<h3>Phương trình 2</h3>
<div class="row">
    <div>
        <label>a'</label>
        <input id="a1" type="number">
    </div>
    <div>
        <label>b'</label>
        <input id="b1" type="number">
    </div>
    <div>
        <label>c'</label>
        <input id="c1" type="number">
    </div>
</div>

<div class="buttons">
    <button class="solve" onclick="giai()">🔍 Giải</button>
    <button class="clear" onclick="xoa()">🗑 Xóa</button>
</div>

<div id="result"></div>

</div>

<script>
function giai(){

let a=+document.getElementById("a").value;
let b=+document.getElementById("b").value;
let c=+document.getElementById("c").value;
let a1=+document.getElementById("a1").value;
let b1=+document.getElementById("b1").value;
let c1=+document.getElementById("c1").value;

let D=a*b1-a1*b;
let Dx=c*b1-c1*b;
let Dy=a*c1-a1*c;
let r=document.getElementById("result");

r.style.display="block";

if(D==0){
    r.innerHTML=Dx==0&&Dy==0
    ?"<div class='answer'>♾️ Hệ có vô số nghiệm</div>"
    :"<div class='answer'>❌ Hệ vô nghiệm</div>";
    return;
}

let x=Dx/D;
let y=Dy/D;

r.innerHTML=`
<h2>📖 Cách giải</h2>

<div class="step">
<b>Tính D:</b><br>
D = a × b' − a' × b<br>
D = ${a} × ${b1} − ${a1} × ${b}<br>
D = <b>${D}</b>
</div>

<div class="step">
<b>Tính Dₓ:</b><br>
Dₓ = c × b' − c' × b<br>
Dₓ = ${c} × ${b1} − ${c1} × ${b}<br>
Dₓ = <b>${Dx}</b>
</div>

<div class="step">
<b>Tính Dᵧ:</b><br>
Dᵧ = a × c' − a' × c<br>
Dᵧ = ${a} × ${c1} − ${a1} × ${c}<br>
Dᵧ = <b>${Dy}</b>
</div>

<div class="step">
<b>Tính x:</b><br>
x = Dₓ / D<br>
x = ${Dx} / ${D}<br>
x = <b>${x}</b>
</div>

<div class="step">
<b>Tính y:</b><br>
y = Dᵧ / D<br>
y = ${Dy} / ${D}<br>
y = <b>${y}</b>
</div>

<div class="answer">
<h2>✅ Kết quả</h2>
x = <b>${x}</b> &nbsp;&nbsp; y = <b>${y}</b><br>
Nghiệm: <b>(${x}; ${y})</b>
</div>
`;
}

function xoa(){
document.querySelectorAll("input").forEach(e=>e.value="");
document.getElementById("result").style.display="none";
}
</script>

</body>
</html>
