<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Giải hệ phương trình</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:35px 15px;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
}

.box{
    max-width:750px;
    margin:auto;
    padding:25px;
    background:#ffffff12;
    border-radius:18px;
    box-shadow:0 10px 35px #0005;
}

h1{
    text-align:center;
}

.system{
    text-align:center;
    font-size:23px;
    line-height:1.8;
    margin:20px;
}

.row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:12px 0 25px;
}

label{
    display:block;
    color:#cbd5e1;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:11px;
    border:1px solid #64748b;
    border-radius:8px;
    background:#0f172acc;
    color:white;
    text-align:center;
    font-size:16px;
}

.buttons{
    display:flex;
    gap:10px;
}

button{
    flex:1;
    padding:12px;
    border:0;
    border-radius:9px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.solve{
    background:#2563eb;
}

.clear{
    background:#475569;
}

#result{
    display:none;
    margin-top:20px;
    padding:20px;
    background:#0f172acc;
    border-radius:14px;
    line-height:2;
}

.step{
    padding:15px;
    margin:12px 0;
    border-left:4px solid #60a5fa;
    background:#ffffff08;
    border-radius:8px;
    overflow-x:auto;
}

.answer{
    text-align:center;
    margin-top:20px;
    padding:18px;
    border-radius:10px;
    background:#16a34a33;
    font-size:20px;
}

.error{
    text-align:center;
    margin-top:20px;
    padding:18px;
    border-radius:10px;
    background:#dc262633;
    font-size:18px;
}

.warning{
    text-align:center;
    margin-top:20px;
    padding:18px;
    border-radius:10px;
    background:#f59e0b33;
    font-size:18px;
}

@media(max-width:550px){
    .row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="box">

<h1>🧮 Giải hệ phương trình</h1>

<div class="system">
    2 phương trình bậc nhất 2 ẩn<br>
    <b>Phương pháp thế</b>
</div>

<h3>Phương trình 1</h3>

<div class="row">

<div>
<label>a</label>
<input id="a" type="number" step="any">
</div>

<div>
<label>b</label>
<input id="b" type="number" step="any">
</div>

<div>
<label>c</label>
<input id="c" type="number" step="any">
</div>

</div>

<h3>Phương trình 2</h3>

<div class="row">

<div>
<label>a'</label>
<input id="a1" type="number" step="any">
</div>

<div>
<label>b'</label>
<input id="b1" type="number" step="any">
</div>

<div>
<label>c'</label>
<input id="c1" type="number" step="any">
</div>

</div>

<div class="buttons">

<button class="solve" onclick="giai()">
🔍 GIẢI
</button>

<button class="clear" onclick="xoa()">
🗑 XÓA
</button>

</div>

<div id="result"></div>

</div>

<script>

function f(n){

    if(Math.abs(n) < 1e-10)
        n = 0;

    return Number.isInteger(n)
        ? n
        : Number(n.toFixed(6));
}

function dau(n){

    if(n >= 0)
        return "+ " + f(n);

    return "− " + f(Math.abs(n));
}

function term(coef, variable){

    if(coef === 0)
        return "";

    if(coef === 1)
        return variable;

    if(coef === -1)
        return "−" + variable;

    return f(coef) + variable;
}

function equation(a,b,c){

    let s = "";

    if(a !== 0)
        s += term(a,"x");

    if(b !== 0){

        if(s !== "")
            s += " " + dau(b) + "y";
        else
            s += term(b,"y");

    }

    if(s === "")
        s = "0";

    s += " = " + f(c);

    return s;
}

function checkEquation(a,b,c){

    if(a === 0 && b === 0){

        if(c === 0)
            return "infinite";

        return "none";
    }

    return "normal";
}

function giai(){

    let a = Number(document.getElementById("a").value);
    let b = Number(document.getElementById("b").value);
    let c = Number(document.getElementById("c").value);

    let a1 = Number(document.getElementById("a1").value);
    let b1 = Number(document.getElementById("b1").value);
    let c1 = Number(document.getElementById("c1").value);

    let r = document.getElementById("result");

    if(
        document.getElementById("a").value === "" ||
        document.getElementById("b").value === "" ||
        document.getElementById("c").value === "" ||
        document.getElementById("a1").value === "" ||
        document.getElementById("b1").value === "" ||
        document.getElementById("c1").value === ""
    ){

        r.style.display = "block";

        r.innerHTML = `
        <div class="warning">
            ⚠️ Vui lòng nhập đủ 6 hệ số.
        </div>
        `;

        return;
    }

    r.style.display = "block";

    let html = "";

    let check1 = checkEquation(a,b,c);
    let check2 = checkEquation(a1,b1,c1);

    if(check1 === "none" || check2 === "none"){

        html += `
        <div class="step">
            ${equation(a,b,c)}
            <br>
            ${equation(a1,b1,c1)}
        </div>

        <div class="error">
            ❌ <b>Hệ vô nghiệm</b>
        </div>
        `;

        r.innerHTML = html;
        return;
    }

    if(check1 === "infinite" && check2 === "infinite"){

        html += `
        <div class="step">
            ${equation(a,b,c)}
            <br>
            ${equation(a1,b1,c1)}
        </div>

        <div class="answer">
            ♾️ <b>Hệ có vô số nghiệm.</b>
        </div>
        `;

        r.innerHTML = html;
        return;
    }

    if(check1 === "infinite"){

        a = a1;
        b = b1;
        c = c1;

        a1 = 0;
        b1 = 0;
        c1 = 0;
    }

    let p,q;

    if(b !== 0){

        p = -a/b;
        q = c/b;

        html += `
        <div class="step">

        <b>Bước 1</b>

        <br><br>

        ${equation(a,b,c)}

        <br><br>

        ${f(b)}y = ${f(c)} − ${f(a)}x

        <br><br>

        <b>
        y = ${f(q)} ${p >= 0 ? "+ " + f(p) + "x" : "− " + f(Math.abs(p)) + "x"}
        </b>

        </div>
        `;

        let A = a1 + b1*p;
        let B = b1*q;

        html += `
        <div class="step">

        <b>Bước 2</b>

        <br><br>

        ${equation(a1,b1,c1)}

        <br><br>

        ${f(a1)}x + ${f(b1)}
        (${f(q)} ${p >= 0 ? "+ " + f(p) + "x" : "− " + f(Math.abs(p)) + "x"})
        = ${f(c1)}

        <br><br>

        ${f(A)}x + ${f(B)} = ${f(c1)}

        </div>
        `;

        if(Math.abs(A) < 1e-10){

            if(Math.abs(B-c1) < 1e-10){

                html += `
                <div class="answer">

                ♾️ <b>Hệ có vô số nghiệm.</b>

                <br><br>

                y = ${f(q)}
                ${p >= 0 ? "+ " + f(p) + "x" : "− " + f(Math.abs(p)) + "x"}

                </div>
                `;

            }
            else{

                html += `
                <div class="error">

                ❌ <b>Hệ vô nghiệm.</b>

                </div>
                `;

            }

            r.innerHTML = html;
            return;
        }

        let x = (c1-B)/A;

        html += `
        <div class="step">

        <b>Bước 3</b>

        <br><br>

        ${f(A)}x = ${f(c1-B)}

        <br><br>

        x = <b>${f(x)}</b>

        </div>
        `;

        let y = q + p*x;

        html += `
        <div class="step">

        <b>Bước 4</b>

        <br><br>

        y =
        ${f(q)}
        ${p >= 0 ? "+ " + f(p) + "x" : "− " + f(Math.abs(p)) + "x"}

        <br><br>

        y = ${f(y)}

        </div>

        <div class="answer">

        ✅ <b>Kết quả</b>

        <br><br>

        x = ${f(x)}

        <br>

        y = ${f(y)}

        <br><br>

        Nghiệm của hệ là:

        <br>

        <b>
        (${f(x)} ; ${f(y)})
        </b>

        </div>
        `;

    }

    else{

        if(a === 0){

            r.innerHTML = `
            <div class="error">
                ❌ Không thể xử lý trường hợp này.
            </div>
            `;

            return;
        }

        let x = c/a;

        html += `
        <div class="step">

        <b>Bước 1</b>

        <br><br>

        ${equation(a,b,c)}

        <br><br>

        ${f(a)}x = ${f(c)}

        <br><br>

        x = <b>${f(x)}</b>

        </div>
        `;

        if(b1 !== 0){

            let y = (c1-a1*x)/b1;

            html += `
            <div class="step">

            <b>Bước 2</b>

            <br><br>

            ${f(a1)} × ${f(x)}
            ${b1 >= 0 ? "+ " + f(b1) + "y" : "− " + f(Math.abs(b1)) + "y"}
            = ${f(c1)}

            <br><br>

            y = <b>${f(y)}</b>

            </div>

            <div class="answer">

            ✅ <b>Kết quả</b>

            <br><br>

            x = ${f(x)}

            <br>

            y = ${f(y)}

            <br><br>

            Nghiệm của hệ là:

            <br>

            <b>
            (${f(x)} ; ${f(y)})
            </b>

            </div>
            `;

        }

        else{

            if(Math.abs(a1*x-c1) < 1e-10){

                html += `
                <div class="answer">

                ♾️ <b>Hệ có vô số nghiệm.</b>

                <br><br>

                x = ${f(x)}

                <br>

                y có thể nhận mọi giá trị thực.

                </div>
                `;

            }
            else{

                html += `
                <div class="error">

                ❌ <b>Hệ vô nghiệm.</b>

                </div>
                `;

            }

        }

    }

    r.innerHTML = html;
}

function xoa(){

    document
    .querySelectorAll("input")
    .forEach(e => e.value = "");

    document
    .getElementById("result")
    .style.display = "none";
}

</script>

</body>
</html>
