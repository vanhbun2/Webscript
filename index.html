<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Giải hệ phương trình</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:35px 15px;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
    transition:background .5s,color .5s;
}

.box{
    max-width:750px;
    margin:auto;
    padding:30px;
    border-radius:18px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    box-shadow:0 10px 35px rgba(0,0,0,.3);
    transition:.4s;
}

h1{
    text-align:center;
    margin-top:0;
}

.theme{
    display:block;
    margin:0 auto 20px;
    padding:9px 16px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    background:#facc15;
    color:#111;
    font-weight:bold;
    transition:.25s;
}

.theme:hover{
    transform:scale(1.05);
}

.equation{
    margin:20px 0;
    padding:18px;
    border-radius:14px;
    background:rgba(255,255,255,.1);
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
}

input{
    width:100%;
    padding:12px;
    border:0;
    outline:none;
    border-radius:9px;
    font-size:16px;
    transition:.25s;
}

input:focus{
    transform:translateY(-2px);
    box-shadow:0 0 0 3px rgba(59,130,246,.4);
}

.buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:20px;
}

button{
    padding:12px 25px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.25s;
}

.solve{
    background:#22c55e;
    color:white;
}

.clear{
    background:#ef4444;
    color:white;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 7px 15px rgba(0,0,0,.25);
}

button:active{
    transform:scale(.94);
}

#result{
    margin-top:25px;
    padding:20px;
    border-radius:14px;
    background:rgba(0,0,0,.18);
    line-height:1.8;
}

.fade{
    animation:fade .5s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.title{
    margin-top:18px;
    font-weight:bold;
}

.answer{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:rgba(34,197,94,.2);
    font-weight:bold;
}

body.light{
    background:linear-gradient(135deg,#dbeafe,#f8fafc);
    color:#111827;
}

body.light .box{
    background:rgba(255,255,255,.75);
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

body.light .equation{
    background:rgba(255,255,255,.65);
}

body.light #result{
    background:rgba(255,255,255,.65);
}

@media(max-width:600px){
    .row{
        grid-template-columns:1fr;
    }

    .box{
        padding:20px;
    }
}
</style>
</head>

<body>

<div class="box">

<h1>GIẢI HỆ PHƯƠNG TRÌNH</h1>

<button class="theme" onclick="doiTheme()">☀️ / 🌙 Dark / Light</button>

<div class="equation">
    <h3>Phương trình (1)</h3>

    <div class="row">
        <input type="number" id="a" placeholder="a">
        <input type="number" id="b" placeholder="b">
        <input type="number" id="c" placeholder="c">
    </div>

    <p>ax + by = c</p>
</div>

<div class="equation">
    <h3>Phương trình (2)</h3>

    <div class="row">
        <input type="number" id="a1" placeholder="a'">
        <input type="number" id="b1" placeholder="b'">
        <input type="number" id="c1" placeholder="c'">
    </div>

    <p>a'x + b'y = c'</p>
</div>

<div class="buttons">
    <button class="solve" onclick="giai()">GIẢI</button>
    <button class="clear" onclick="xoa()">XÓA</button>
</div>

<div id="result"></div>

</div>

<script>
function f(n){
    if(Math.abs(n)<0.0000001) n=0;
    return Number(n.toFixed(6));
}

function frac(n,d){
    if(Math.abs(n)<0.0000001) return "0";

    if(d<0){
        n=-n;
        d=-d;
    }

    let u=Math.abs(n);
    let v=Math.abs(d);

    while(v!=0){
        let r=u%v;
        u=v;
        v=r;
    }

    n=n/u;
    d=d/u;

    if(d==1) return n;
    return n+"/"+d;
}

function doiTheme(){
    document.body.classList.toggle("light");
}

function giai(){

    let a=Number(document.getElementById("a").value || 0);
    let b=Number(document.getElementById("b").value || 0);
    let c=Number(document.getElementById("c").value || 0);

    let a1=Number(document.getElementById("a1").value || 0);
    let b1=Number(document.getElementById("b1").value || 0);
    let c1=Number(document.getElementById("c1").value || 0);

    let result=document.getElementById("result");

    result.classList.remove("fade");
    void result.offsetWidth;
    result.classList.add("fade");

    let html="";

    if(a==0 && b==0){

        html+="<div class='title'>Xét phương trình (1):</div>";
        html+="<div>0x + 0y = "+c+"</div>";

        if(c!=0){
            html+="<div>Phương trình (1) vô nghiệm.</div>";
            html+="<div class='answer'>Hệ phương trình vô nghiệm.</div>";
            result.innerHTML=html;
            return;
        }

        if(a1==0 && b1==0){

            if(c1==0){
                html+="<div>Phương trình (1) và phương trình (2) đều đúng với mọi x, y.</div>";
                html+="<div class='answer'>Hệ phương trình có vô số nghiệm.</div>";
            }else{
                html+="<div>Phương trình (2) vô nghiệm.</div>";
                html+="<div class='answer'>Hệ phương trình vô nghiệm.</div>";
            }

            result.innerHTML=html;
            return;
        }

        if(b1!=0){

            let y=c1/b1;

            html+="<div class='title'>Từ phương trình (2), ta có:</div>";
            html+="<div>"+b1+"y = "+c1+"</div>";
            html+="<div>y = "+frac(c1,b1)+"</div>";
            html+="<div class='answer'>Vậy nghiệm của hệ phương trình là: (x ; y) = (x ; "+frac(c1,b1)+"), với x ∈ R.</div>";

        }else{

            let x=c1/a1;

            html+="<div class='title'>Từ phương trình (2), ta có:</div>";
            html+="<div>"+a1+"x = "+c1+"</div>";
            html+="<div>x = "+frac(c1,a1)+"</div>";
            html+="<div class='answer'>Vậy nghiệm của hệ phương trình là: (x ; y) = ("+frac(c1,a1)+" ; y), với y ∈ R.</div>";
        }

        result.innerHTML=html;
        return;
    }

    if(b!=0){

        let p=-a/b;
        let q=c/b;

        html+="<div class='title'>Từ phương trình (1), ta có:</div>";
        html+="<div>"+a+"x + "+b+"y = "+c+"</div>";
        html+="<div>"+b+"y = "+c+" - "+a+"x</div>";
        html+="<div>y = "+frac(-a,b)+"x + "+frac(c,b)+"</div>";

        html+="<div class='title'>Thay y = "+frac(-a,b)+"x + "+frac(c,b)+" vào phương trình (2):</div>";

        html+="<div>"+a1+"x + "+b1+"("+frac(-a,b)+"x + "+frac(c,b)+") = "+c1+"</div>";

        let A=a1+b1*p;
        let B=b1*q-c1;

        html+="<div>"+f(A)+"x + "+f(B)+" = 0</div>";

        if(Math.abs(A)<0.0000001){

            if(Math.abs(B)<0.0000001){
                html+="<div>Phương trình luôn đúng.</div>";
                html+="<div class='answer'>Hệ phương trình có vô số nghiệm.</div>";
            }else{
                html+="<div>Điều này vô lý.</div>";
                html+="<div class='answer'>Hệ phương trình vô nghiệm.</div>";
            }

            result.innerHTML=html;
            return;
        }

        let x=-B/A;

        html+="<div>"+f(A)+"x = "+f(-B)+"</div>";
        html+="<div>x = "+frac(-B,A)+"</div>";

        html+="<div class='title'>Thay x = "+frac(-B,A)+" vào phương trình (1):</div>";

        let y=p*x+q;

        html+="<div>"+a+"("+frac(-B,A)+") + "+b+"y = "+c+"</div>";
        html+="<div>"+b+"y = "+f(c-a*x)+"</div>";
        html+="<div>y = "+frac(c-a*x,b)+"</div>";

        html+="<div class='answer'>Vậy nghiệm của hệ phương trình là: (x ; y) = ("+frac(-B,A)+" ; "+frac(c-a*x,b)+").</div>";

    }else{

        let x=c/a;

        html+="<div class='title'>Từ phương trình (1), ta có:</div>";
        html+="<div>"+a+"x = "+c+"</div>";
        html+="<div>x = "+frac(c,a)+"</div>";

        html+="<div class='title'>Thay x = "+frac(c,a)+" vào phương trình (2):</div>";
        html+="<div>"+a1+"("+frac(c,a)+") + "+b1+"y = "+c1+"</div>";

        let D=c1-a1*x;

        if(b1==0){

            if(Math.abs(D)<0.0000001){
                html+="<div>Phương trình luôn đúng.</div>";
                html+="<div class='answer'>Hệ phương trình có vô số nghiệm.</div>";
            }else{
                html+="<div>Điều này vô lý.</div>";
                html+="<div class='answer'>Hệ phương trình vô nghiệm.</div>";
            }

            result.innerHTML=html;
            return;
        }

        let y=D/b1;

        html+="<div>"+b1+"y = "+f(D)+"</div>";
        html+="<div>y = "+frac(D,b1)+"</div>";

        html+="<div class='answer'>Vậy nghiệm của hệ phương trình là (" +frac(c,a)+ " ; " +frac(D,b1)+ ").</div>";
    }

    result.innerHTML=html;
}

function xoa(){

    document.getElementById("a").value="";
    document.getElementById("b").value="";
    document.getElementById("c").value="";
    document.getElementById("a1").value="";
    document.getElementById("b1").value="";
    document.getElementById("c1").value="";

    document.getElementById("result").innerHTML="";
}
</script>

</body>
</html>
