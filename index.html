<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giải Hệ Hai Phương Trình 2 Ẩn</title>
</head>
<body>
    <h2>Giải hệ phương trình:</h2>
    <p>ax + by = c</p>
    <p>a'x + b'y = c'</p>
    
    <label>Nhập a:</label> <input type="number" id="a"><br><br>
    <label>Nhập b:</label> <input type="number" id="b"><br><br>
    <label>Nhập c:</label> <input type="number" id="c"><br><br>
    
    <label>Nhập a':</label> <input type="number" id="a1"><br><br>
    <label>Nhập b':</label> <input type="number" id="b1"><br><br>
    <label>Nhập c':</label> <input type="number" id="c1"><br><br>
    
    <button onclick="giaiHePT()">Giải hệ</button>
    <p id="ketqua"></p>

    <script>
        function giaiHePT() {
            let a = parseFloat(document.getElementById('a').value);
            let b = parseFloat(document.getElementById('b').value);
            let c = parseFloat(document.getElementById('c').value);
            let a1 = parseFloat(document.getElementById('a1').value);
            let b1 = parseFloat(document.getElementById('b1').value);
            let c1 = parseFloat(document.getElementById('c1').value);
            let kq = document.getElementById('ketqua');
            
            let D = a * b1 - a1 * b;
            let Dx = c * b1 - c1 * b;
            let Dy = a * c1 - a1 * c;
            
            if (D === 0) {
                if (Dx === 0 && Dy === 0) {
                    kq.innerText = "Hệ phương trình có vô số nghiệm!";
                } else {
                    kq.innerText = "Hệ phương trình vô nghiệm!";
                }
            } else {
                let x = Dx / D;
                let y = Dy / D;
                kq.innerText = "Nghiệm của hệ là: x = " + x + ", y = " + y;
            }
        }
    </script>
</body>
</html>
