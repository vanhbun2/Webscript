
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giải hệ phương trình — Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    padding:30px 15px;
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:#fff;
    min-height:100vh;
    transition:background .5s,color .5s;
}
.box{
    max-width:820px;margin:auto;padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(14px);
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    animation:pop .5s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
h1{text-align:center;margin-bottom:8px;font-size:24px;letter-spacing:1px}
.sub{text-align:center;opacity:.7;font-size:13px;margin-bottom:20px}

.topbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.theme,.demo{
    padding:9px 16px;border:0;border-radius:10px;cursor:pointer;
    font-weight:bold;transition:.25s;font-size:14px;
}
.theme{background:#facc15;color:#111}
.demo{background:#8b5cf6;color:#fff}
.theme:hover,.demo:hover{transform:scale(1.06)}

.equation{
    margin:16px 0;padding:18px;border-radius:14px;
    background:rgba(255,255,255,.08);
    border-left:4px solid #22c55e;
}
.equation h3{margin-bottom:12px;font-size:16px;color:#4ade80}

.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
input{
    width:100%;padding:12px;border:0;outline:none;
    border-radius:9px;font-size:16px;
    background:rgba(255,255,255,.9);color:#111;
    transition:.25s;font-family:inherit;
}
input:focus{transform:translateY(-2px);box-shadow:0 0 0 3px rgba(59,130,246,.5)}
input::placeholder{color:#888}

.hint{font-size:12px;opacity:.65;margin-top:8px}

.buttons{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
button.act{
    padding:12px 26px;border:0;border-radius:10px;cursor:pointer;
    font-size:15px;font-weight:bold;transition:.25s;
}
.solve{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.clear{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
button.act:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.3)}
button.act:active{transform:scale(.95)}

#result{
    margin-top:24px;padding:20px;border-radius:14px;
    background:rgba(0,0,0,.22);line-height:1.9;
    font-size:15px;display:none;
}
#result.show{display:block;animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.title{margin-top:16px;font-weight:bold;color:#60a5fa}
.title:first-child{margin-top:0}
.answer{
    margin-top:16px;padding:14px;border-radius:10px;
    background:linear-gradient(135deg,rgba(34,197,94,.35),rgba(34,197,94,.15));
    font-weight:bold;border-left:4px solid #22c55e;
}
.answer.warn{background:linear-gradient(135deg,rgba(239,68,68,.35),rgba(239,68,68,.15));border-left-color:#ef4444}
.frac{font-family:'Cambria Math',Georgia,serif;font-style:italic}
.check{margin-top:12px;font-size:13px;opacity:.8;padding:10px;border-radius:8px;background:rgba(96,165,250,.15)}

canvas{display:block;margin:20px auto 0;max-width:100%;border-radius:12px;background:rgba(255,255,255,.05)}

/* Light theme */
body.light{background:linear-gradient(135deg,#dbeafe,#f8fafc);color:#111827}
body.light .box{background:rgba(255,255,255,.85);box-shadow:0 12px 40px rgba(0,0,0,.12)}
body.light .equation{background:rgba(255,255,255,.7)}
body.light #result{background:rgba(255,255,255,.75)}
body.light input{background:#fff;border:1px solid #cbd5e1}
body.light .title{color:#1d4ed8}
body.light .check{background:rgba(59,130,246,.12)}

@media(max-width:600px){
    .row{grid-template-columns:1fr}
    .box{padding:20px}
    h1{font-size:20px}
}
</style>
</head>

<body>
<div class="box">
    <h1>🧮 GIẢI HỆ PHƯƠNG TRÌNH</h1>
    <p class="sub">Hỗ trợ phân số • Định thức Cramer • Đồ thị • Thử lại nghiệm</p>

    <div class="topbar">
        <button class="theme" onclick="doiTheme()">☀️ / 🌙</button>
        <button class="demo" onclick="viDu()">📋 Ví dụ mẫu</button>
    </div>

    <div class="equation">
        <h3>Phương trình (1)</h3>
        <div class="row">
            <input type="text" id="a" placeholder="a">
            <input type="text" id="b" placeholder="b">
            <input type="text" id="c" placeholder="c">
        </div>
        <p style="margin-top:10px;font-style:italic">ax + by = c</p>
        <p class="hint">💡 Có thể nhập phân số dạng 1/2, -3/4</p>
    </div>

    <div class="equation">
        <h3>Phương trình (2)</h3>
        <div class="row">
            <input type="text" id="a1" placeholder="a'">
            <input type="text" id="b1" placeholder="b'">
            <input type="text" id="c1" placeholder="c'">
        </div>
        <p style="margin-top:10px;font-style:italic">a'x + b'y = c'</p>
    </div>

    <div class="buttons">
        <button class="act solve" onclick="giai()">▶ GIẢI</button>
        <button class="act clear" onclick="xoa()">✖ XÓA</button>
    </div>

    <div id="result"></div>
    <canvas id="graph" width="700" height="420" style="display:none"></canvas>
</div>

<script>
/* ============ TIỆN ÍCH PHÂN SỐ (dùng BigInt) ============ */
function gcdBig(a, b){
    a = a < 0n ? -a : a;
    b = b < 0n ? -b : b;
    while(b){ [a,b] = [b, a % b]; }
    return a;
}
function makeFrac(n, d){
    if(d === 0n) return null;
    if(n === 0n) return {n:0n, d:1n};
    if(d < 0n){ n = -n; d = -d; }
    const g = gcdBig(n, d);
    return {n: n/g, d: d/g};
}
function fracAdd(x, y){ return makeFrac(x.n*y.d + y.n*x.d, x.d*y.d); }
function fracSub(x, y){ return makeFrac(x.n*y.d - y.n*x.d, x.d*y.d); }
function fracMul(x, y){ return makeFrac(x.n*y.n, x.d*y.d); }
function fracDiv(x, y){
    if(y.n === 0n) return null;
    return makeFrac(x.n*y.d, x.d*y.n);
}
function fracEq(x, y){ return x.n*y.d === y.n*x.d; }
function fracStr(f){
    if(!f) return "?";
    if(f.d === 1n) return f.n.toString();
    return f.n + "/" + f.d;
}
function fracDec(f){
    if(!f) return "?";
    const v = Number(f.n) / Number(f.d);
    if(f.d === 1n) return f.n.toString();
    return v.toFixed(6).replace(/\.?0+$/,'');
}
function fracShow(f){
    if(!f) return "?";
    if(f.d === 1n) return f.n.toString();
    return fracStr(f) + " ≈ " + fracDec(f);
}
function numToFrac(str){
    str = (str||"").trim();
    if(str === "") return {n:0n, d:1n};
    if(str.includes("/")){
        const [a,b] = str.split("/");
        const n = BigInt(Math.trunc(Number(a)));
        const d = BigInt(Math.trunc(Number(b)));
        if(d === 0n) return null;
        return makeFrac(n, d);
    }
    // số thập phân
    const v = Number(str);
    if(isNaN(v)) return null;
    if(Number.isInteger(v)) return {n: BigInt(v), d: 1n};
    // chuyển thập phân -> phân số
    const s = String(v);
    const dec = s.split(".")[1] || "";
    const pow = BigInt(10 ** dec.length);
    return makeFrac(BigInt(Math.round(v * Number(pow))), pow);
}
const F0 = {n:0n, d:1n};
const F1 = {n:1n, d:1n};

/* ============ ĐỔI THEME ============ */
function doiTheme(){ document.body.classList.toggle("light"); }

/* ============ VÍ DỤ MẪU ============ */
function viDu(){
    const ds = [
        ["2","3","7","3","-1","5"],     // nghiệm duy nhất
        ["1","1","2","2","2","4"],      // vô số nghiệm
        ["1","1","1","1","1","3"],      // vô nghiệm
        ["0","2","4","3","0","6"],      // nghiệm đặc biệt
        ["1/2","-1/3","1","1/4","1/6","2"] // phân số
    ];
    const v = ds[Math.floor(Math.random()*ds.length)];
    ["a","b","c","a1","b1","c1"].forEach((id,i)=>document.getElementById(id).value = v[i]);
}

/* ============ XÓA ============ */
function xoa(){
    ["a","b","c","a1","b1","c1"].forEach(id=>document.getElementById(id).value="");
    const r = document.getElementById("result");
    r.classList.remove("show"); r.innerHTML="";
    document.getElementById("graph").style.display="none";
}

/* ============ GIẢI HỆ ============ */
function giai(){
    const a  = numToFrac(document.getElementById("a").value);
    const b  = numToFrac(document.getElementById("b").value);
    const c  = numToFrac(document.getElementById("c").value);
    const a1 = numToFrac(document.getElementById("a1").value);
    const b1 = numToFrac(document.getElementById("b1").value);
    const c1 = numToFrac(document.getElementById("c1").value);

    if(!a||!b||!c||!a1||!b1||!c1){
        alert("Vui lòng nhập số hoặc phân số hợp lệ (ví dụ: 2, -3, 1/2)");
        return;
    }

    const r = document.getElementById("result");
    r.classList.remove("show"); void r.offsetWidth; r.classList.add("show");

    let html = "";

    /* === Tính định thức === */
    const D  = fracSub(fracMul(a,b1), fracMul(b,a1));   // a*b' - b*a'
    const Dx = fracSub(fracMul(c,b1), fracMul(b,c1));   // c*b' - b*c'
    const Dy = fracSub(fracMul(a,c1), fracMul(c,a1));   // a*c' - c*a'

    html += "<div class='title'>📐 Định thức:</div>";
    html += "<div>D = a·b' − b·a' = " + fracStr(D) + "</div>";
    html += "<div>D<sub>x</sub> = c·b' − b·c' = " + fracStr(Dx) + "</div>";
    html += "<div>D<sub>y</sub> = a·c' − c·a' = " + fracStr(Dy) + "</div>";

    /* === Biện luận === */
    if(D.n !== 0n){
        const x = fracDiv(Dx, D);
        const y = fracDiv(Dy, D);

        html += "<div class='title'>✅ Vì D ≠ 0 nên hệ có nghiệm duy nhất:</div>";
        html += "<div>x = D<sub>x</sub>/D = " + fracShow(x) + "</div>";
        html += "<div>y = D<sub>y</sub>/D = " + fracShow(y) + "</div>";
        html += "<div class='answer'>Vậy hệ có nghiệm duy nhất: (x ; y) = (" + fracStr(x) + " ; " + fracStr(y) + ")</div>";

        html += kiemTra(a,b,c,a1,b1,c1,x,y);

        document.getElementById("graph").style.display = "block";
        veDoThi(a,b,c,a1,b1,c1, Number(x.n)/Number(x.d), Number(y.n)/Number(y.d));
    }
    else if(D.n === 0n && Dx.n === 0n && Dy.n === 0n){
        html += "<div class='title'>⚠️ D = D<sub>x</sub> = D<sub>y</sub> = 0</div>";
        html += "<div>Hệ có vô số nghiệm (hai phương trình tương đương).</div>";

        // Tìm nghiệm tổng quát
        if(b.n !== 0n){
            // y = (c - a x)/b
            const k = fracDiv({n:-a.n, d:a.d}, b); // -a/b
            const m = fracDiv(c, b);              // c/b
            html += "<div class='title'>Nghiệm tổng quát:</div>";
            html += "<div>y = " + fracStr(k) + "·x + " + fracStr(m) + ", với x ∈ ℝ</div>";
        } else if(a.n !== 0n){
            const x0 = fracDiv(c, a);
            html += "<div class='title'>Nghiệm tổng quát:</div>";
            html += "<div>x = " + fracStr(x0) + ", với y ∈ ℝ</div>";
        } else {
            html += "<div class='title'>Nghiệm tổng quát:</div>";
            html += "<div>(x ; y) với x, y ∈ ℝ tùy ý</div>";
        }
        html += "<div class='answer'>Vậy hệ có vô số nghiệm.</div>";
        document.getElementById("graph").style.display = "none";
    }
    else {
        html += "<div class='title'>❌ Trường hợp D = 0 nhưng D<sub>x</sub> ≠ 0 hoặc D<sub>y</sub> ≠ 0</div>";
        html += "<div>Hệ phương trình vô nghiệm.</div>";
        html += "<div class='answer warn'>Vậy hệ phương trình vô nghiệm.</div>";
        document.getElementById("graph").style.display = "none";
    }

    r.innerHTML = html;
}

/* ============ THỬ LẠI NGHIỆM ============ */
function kiemTra(a,b,c,a1,b1,c1,x,y){
    const v1 = fracAdd(fracMul(a,x), fracMul(b,y));
    const v2 = fracAdd(fracMul(a1,x), fracMul(b1,y));
    const ok1 = fracEq(v1, c);
    const ok2 = fracEq(v2, c1);
    const icon = ok1 && ok2 ? "✅" : "⚠️";
    return "<div class='check'>" + icon +
        " Thử lại: " + fracStr(a) + "·(" + fracStr(x) + ") + " + fracStr(b) + "·(" + fracStr(y) + ") = " + fracStr(v1) +
        " | " + fracStr(a1) + "·(" + fracStr(x) + ") + " + fracStr(b1) + "·(" + fracStr(y) + ") = " + fracStr(v2) +
        "</div>";
}

/* ============ VẼ ĐỒ THỊ ============ */
function veDoThi(a,b,c,a1,b1,c1,x0,y0){
    const cv = document.getElementById("graph");
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);

    // scale
    const range = Math.max(5, Math.abs(x0)*1.6, Math.abs(y0)*1.6);
    const sx = v => W/2 + (v/range)*(W/2);
    const sy = v => H/2 - (v/range)*(H/2);

    // trục
    ctx.strokeStyle = "rgba(150,150,150,.5)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,sy(0)); ctx.lineTo(W,sy(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx(0),0); ctx.lineTo(sx(0),H); ctx.stroke();

    // hàm vẽ đường thẳng ax+by=c
    function veDuong(a,b,c,color){
        ctx.strokeStyle = color; ctx.lineWidth = 2.5;
        ctx.beginPath();
        let started = false;
        for(let px = 0; px <= W; px++){
            const xv = (px - W/2)/(W/2) * range;
            let yv;
            if(Math.abs(b) > 1e-9) yv = (c - a*xv)/b;
            else continue;
            const py = sy(yv);
            if(!started){ ctx.moveTo(px,py); started = true; }
            else ctx.lineTo(px,py);
        }
        ctx.stroke();
    }
    veDuong(a,b,c,"#22c55e");
    veDuong(a1,b1,c1,"#f59e0b");

    // giao điểm
    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(sx(x0), sy(y0), 6, 0, 2*Math.PI);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "13px Arial";
    ctx.fillText("(" + x0.toFixed(2) + " ; " + y0.toFixed(2) + ")", sx(x0)+10, sy(y0)-8);
}
</script>
</body>
</html>
