```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solver 2 Ẩn | Toán 9</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #312e81);

        }

        }

            text-align: center;

<body>

<div class="container">

    <div class="header">
        <h1>🧮 Giải Hệ Phương Trình</h1>
        <p>Hệ hai phương trình bậc nhất hai ẩn — Toán 9</p>
    </div>

    <!-- HỆ PHƯƠNG TRÌNH -->
    <div class="card">

        <div class="system">
            <div>ax + by = c</div>
            <div>a'x + b'y = c'</div>
        </div>

        <div class="title">Phương trình thứ nhất</div>

        <div class="input-row">

            <div class="input-group">
                <label>Hệ số a</label>
                <input type="number" id="a" placeholder="a">
            </div>

            <div class="input-group">
                <label>Hệ số b</label>
                <input type="number" id="b" placeholder="b">
            </div>

            <div class="input-group">
                <label>Hệ số c</label>
                <input type="number" id="c" placeholder="c">
            </div>

        </div>

        <div class="title">Phương trình thứ hai</div>

        <div class="input-row">

            <div class="input-group">
                <label>Hệ số a'</label>
                <input type="number" id="a1" placeholder="a'">
            </div>

            <div class="input-group">
                <label>Hệ số b'</label>
                <input type="number" id="b1" placeholder="b'">
            </div>

            <div class="input-group">
                <label>Hệ số c'</label>
                <input type="number" id="c1" placeholder="c'">
            </div>

        </div>

        <div class="buttons">
            <button class="solve" onclick="giaiHe()">
                🔍 GIẢI HỆ
            </button>

            <button class="clear" onclick="xoa()">
                🗑 XÓA
            </button>
        </div>

    </div>


    <!-- KẾT QUẢ -->
    <div class="card" id="result">

        <h2>📖 Lời giải chi tiết</h2>

        <div id="noiDung"></div>

    </div>


    <div class="footer">
        Công cụ hỗ trợ học Toán 9
    </div>

</div>


<script>

function so(n) {
    if (Number.isInteger(n)) {
        return n.toString();
    }

    return parseFloat(n.toFixed(6)).toString();
}


function giaiHe() {

    let a = Number(document.getElementById("a").value);
    let b = Number(document.getElementById("b").value);
    let c = Number(document.getElementById("c").value);

    let a1 = Number(document.getElementById("a1").value);
    let b1 = Number(document.getElementById("b1").value);
    let c1 = Number(document.getElementById("c1").value);

    let result = document.getElementById("result");
    let noiDung = document.getElementById("noiDung");

    result.style.display = "block";

    /*
        Kiểm tra xem người dùng đã nhập đủ chưa.
    */
    let inputs = [
        document.getElementById("a"),
        document.getElementById("b"),
        document.getElementById("c"),
        document.getElementById("a1"),
        document.getElementById("b1"),
        document.getElementById("c1")
    ];

    for (let input of inputs) {

        if (input.value === "") {

            noiDung.innerHTML =
                '<div class="error">' +
                '⚠️ Vui lòng nhập đầy đủ 6 hệ số!' +
                '</div>';

            return;
        }
    }


    /*
        Tính các định thức
    */

    let D = a * b1 - a1 * b;

    let Dx = c * b1 - c1 * b;

    let Dy = a * c1 - a1 * c;


    /*
        Bước 1: Tính D
    */

    let html = "";

    html += `
        <div class="step">

            <h3>📌 Bước 1: Tính D</h3>

            <div class="formula">
                D = a × b' − a' × b
            </div>

            <div class="formula">
                D = ${so(a)} × ${so(b1)} −
                ${so(a1)} × ${so(b)}
            </div>

            <div class="formula">
                <b>D = ${so(D)}</b>
            </div>

        </div>
    `;


    /*
        Bước 2: Tính Dx
    */

    html += `
        <div class="step">

            <h3>📌 Bước 2: Tính Dₓ</h3>

            <div class="formula">
                Dₓ = c × b' − c' × b
            </div>

            <div class="formula">
                Dₓ = ${so(c)} × ${so(b1)} −
                ${so(c1)} × ${so(b)}
            </div>

            <div class="formula">
                <b>Dₓ = ${so(Dx)}</b>
            </div>

        </div>
    `;


    /*
        Bước 3: Tính Dy
    */

    html += `
        <div class="step">

            <h3>📌 Bước 3: Tính Dᵧ</h3>

            <div class="formula">
                Dᵧ = a × c' − a' × c
            </div>

            <div class="formula">
                Dᵧ = ${so(a)} × ${so(c1)} −
                ${so(a1)} × ${so(c)}
            </div>

            <div class="formula">
                <b>Dᵧ = ${so(Dy)}</b>
            </div>

        </div>
    `;


    /*
        Xét nghiệm
    */

    if (D === 0) {

        if (Dx === 0 && Dy === 0) {

            html += `
                <div class="answer">

                    <h2>♾️ Hệ có vô số nghiệm</h2>

                    <p>
                        Vì D = Dₓ = Dᵧ = 0
                    </p>

                </div>
            `;

        } else {

            html += `
                <div class="error">

                    <h2>❌ Hệ vô nghiệm</h2>

                    <p>
                        Vì D = 0 nhưng Dₓ hoặc Dᵧ khác 0.
                    </p>

                </div>
            `;
        }

    } else {

        /*
            Tính x
        */

        let x = Dx / D;

        /*
            Tính y
        */

        let y = Dy / D;


        html += `
            <div class="step">

                <h3>📌 Bước 4: Tính x</h3>

                <div class="formula">
                    x = Dₓ / D
                </div>

                <div class="formula">
                    x =
                    ${so(Dx)} /
                    ${so(D)}
                </div>

                <div class="formula">
                    <b>x = ${so(x)}</b>
                </div>

            </div>
        `;


        html += `
            <div class="step">

                <h3>📌 Bước 5: Tính y</h3>

                <div class="formula">
                    y = Dᵧ / D
                </div>

                <div class="formula">
                    y =
                    ${so(Dy)} /
                    ${so(D)}
                </div>

                <div class="formula">
                    <b>y = ${so(y)}</b>
                </div>

            </div>
        `;


        /*
            Kết luận
        */

        html += `
            <div class="answer">

                <h2>✅ Kết luận</h2>

                <div class="xy">
                    x = ${so(x)}
                    &nbsp;&nbsp;&nbsp;
                    y = ${so(y)}
                </div>

                <p>
                    Vậy hệ phương trình có nghiệm
                    <b>(${so(x)} ; ${so(y)})</b>.
                </p>

            </div>
        `;
    }


    noiDung.innerHTML = html;
}


function xoa() {

    document.getElementById("a").value = "";
    document.getElementById("b").value = "";
    document.getElementById("c").value = "";

    document.getElementById("a1").value = "";
    document.getElementById("b1").value = "";
    document.getElementById("c1").value = "";

    document.getElementById("result").style.display = "none";

    document.getElementById("noiDung").innerHTML = "";
}

</script>

</body>
</html>
